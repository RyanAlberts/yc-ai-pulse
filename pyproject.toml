[project]
name = "yc-ai-pulse"
version = "0.1.0"
description = "Open-source YC batch analyzer — VC-style report and dashboard for the most recent Y Combinator batch."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ryan Alberts", email = "ryan.a.alberts@gmail.com" }]
keywords = ["ycombinator", "yc", "ai", "analysis", "vc", "research", "dashboard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "httpx>=0.27",
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13",
  "anthropic>=0.40",
  "claude-agent-sdk>=0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "detect-secrets>=1.5",
]

[project.scripts]
ycai = "ycai.cli:_entrypoint"

[project.urls]
Homepage = "https://github.com/RyanAlberts/yc-ai-pulse"
Issues = "https://github.com/RyanAlberts/yc-ai-pulse/issues"
Changelog = "https://github.com/RyanAlberts/yc-ai-pulse/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ycai"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit security
  "PT",            # pytest style
  "SIM",           # flake8-simplify
  "RUF",
]
ignore = ["S101"]  # asserts in tests are fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]                          # hardcoded "passwords" in test fixtures are fine
"src/ycai/cli.py" = ["B008"]                           # typer.Option in defaults is the idiomatic pattern
"src/ycai/dashboard.py" = ["E501"]                     # HTML templates legitimately have long lines

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
files = ["src/ycai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "e2e: end-to-end tests that exercise the full pipeline",
  "slow: tests that take more than ~1s",
  "live: tests that hit the network (skipped in CI by default)",
]

[tool.coverage.run]
source = ["src/ycai"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
